<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>HTMLGO Watch Test</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        .watch-container {
            width: 90vw;
            height: 90vw;
            max-width: 320px;
            max-height: 320px;
            background: radial-gradient(circle, #1c1c1e 0%, #000000 100%);
            border-radius: 50%;
            border: 2px solid #333333;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 16px;
            text-align: center;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
        }
        .title {
            font-size: 13px;
            font-weight: 700;
            color: #81D4FA;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .time {
            font-size: 11px;
            color: #8e8e93;
            margin-bottom: 12px;
        }
        .counter-display {
            font-size: 32px;
            font-weight: 800;
            color: #ffffff;
            margin: 8px 0;
        }
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }
        .btn {
            background: #2c2c2e;
            color: #ffffff;
            border: 1px solid #444444;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            active-bg: #81D4FA;
            transition: transform 0.1s, background-color 0.1s;
        }
        .btn:active {
            transform: scale(0.92);
            background: #81D4FA;
            color: #000000;
        }
        .color-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            cursor: pointer;
            border: 1px solid #ffffff;
        }
        .dot-blue { background-color: #81D4FA; }
        .dot-green { background-color: #A5D6A7; }
        .dot-red { background-color: #EF9A9A; }
    </style>
</head>
<body>
    <div class="watch-container">
        <div class="title" id="appTitle">HTMLGO Watch</div>
        <div class="time" id="clock">00:00:00</div>
        <div class="counter-display" id="countText">0</div>
        <div class="button-group">
            <div class="btn" onclick="decrement()">-</div>
            <div class="btn" onclick="increment()">+</div>
        </div>
        <div class="color-row">
            <div class="dot dot-blue" onclick="setAccent('#81D4FA')"></div>
            <div class="dot dot-green" onclick="setAccent('#A5D6A7')"></div>
            <div class="dot dot-red" onclick="setAccent('#EF9A9A')"></div>
        </div>
    </div>

    <script>
        let count = 0;
        function updateCount() {
            document.getElementById('countText').innerText = count;
        }
        function increment() {
            count++;
            updateCount();
        }
        function decrement() {
            count--;
            updateCount();
        }
        function setAccent(color) {
            document.getElementById('appTitle').style.color = color;
        }
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString();
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
